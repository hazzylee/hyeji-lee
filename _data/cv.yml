  type: time_table
  contents:
    - title: Postdoctoral Researcher
      institution: Department of Brain Convergence, Korea Brain Research Institute (KBRI), Korea
      year: 2026-Present
      description:
        - Investigating how smartphone use influences the development of cognitive control
        - Conducting a comparative study of children with ADHD and typically developing children, examining how cognitive control development relates to brain structure and function
        - Independently establishing a developmental EEG laboratory, including wireless EEG systems for laboratory research and portable EEG systems for use in educational settings
        - Setting up an EEG hyperscanning system for simultaneous recording from multiple participants
